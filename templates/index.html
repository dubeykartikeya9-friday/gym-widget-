<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Widget AI</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f9f9f9; }
        .chat-container { width: 100%; max-width: 500px; margin: 40px auto; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); padding: 20px; }
        .messages { height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 15px; border-radius: 6px; }
        .user { text-align: right; margin: 5px; color: #333; }
        .bot { text-align: left; margin: 5px; color: #007bff; }
        input, button { padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        input { width: 75%; }
        button { width: 20%; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>Gym AI Assistant</h2>
        <div id="messages" class="messages"></div>
        <input type="text" id="userInput" placeholder="Type your message..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const userInput = document.getElementById("userInput").value;
            if (!userInput.trim()) return;

            const messagesDiv = document.getElementById("messages");
            messagesDiv.innerHTML += `<div class="user"><b>You:</b> ${userInput}</div>`;

            document.getElementById("userInput").value = "";

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: userInput })
                });

                const data = await res.json();
                messagesDiv.innerHTML += `<div class="bot"><b>AI:</b> ${data.response}</div>`;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } catch (err) {
                messagesDiv.innerHTML += `<div class="bot"><b>AI:</b> ❌ Error: ${err}</div>`;
            }
        }
    </script>
</body>
</html>
