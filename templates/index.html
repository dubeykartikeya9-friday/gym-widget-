<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gym Assistant Bot</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #chatbox { width: 100%; height: 300px; border: 1px solid #ccc; padding: 10px; overflow-y: auto; }
    .user { color: blue; }
    .bot { color: green; }
  </style>
</head>
<body>
  <h1>Gym Assistant Bot</h1>
  <div id="chatbox"></div>
  <input type="text" id="userInput" placeholder="Type your message..." />
  <button onclick="sendMessage()">Send</button>

  <script>
    async function sendMessage() {
      const userMessage = document.getElementById("userInput").value;
      if (!userMessage) return;

      const chatbox = document.getElementById("chatbox");
      chatbox.innerHTML += `<div class="user"><b>You:</b> ${userMessage}</div>`;

      const response = await fetch("/get", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userMessage })
      });

      const data = await response.json();
      chatbox.innerHTML += `<div class="bot"><b>Bot:</b> ${data.response}</div>`;
      document.getElementById("userInput").value = "";
      chatbox.scrollTop = chatbox.scrollHeight;
    }
  </script>
</body>
</html>
